name: Website

# Publishes site/ to GitHub Pages. Run by hand (Actions → Website → Run workflow) once Pages is turned on
# with "Source: GitHub Actions"; on a free plan that needs the repository to be public (the 1.0.0 launch).
# Until then the site can live in a small public repository of its own: see site/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
