name: Tests

# Pull requests, and main after a merge. Not every push to a PR branch as well: that ran each PR twice and
# used up the monthly Actions minutes (October 2026).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The runner image has google-chrome-stable, python3 and openssl already.
      - run: google-chrome-stable --version
      # A pull request must not lower the version (scripts/version-check.mjs); it stays put between store uploads.
      - if: github.event_name == 'pull_request'
        run: deno task version-check origin/${{ github.base_ref }}
      - run: deno task test
      - run: deno task pack
      # The Firefox zip through Mozilla's own checker (manifest keys, API names), the same one addons.mozilla.org
      # runs. Firefox itself isn't on the runner; it's checked by hand (docs/ROADMAP.md, Brief 9).
      - run: |
          mkdir -p "$RUNNER_TEMP/firefox" && unzip -q dist/tirekick-*-firefox.zip -d "$RUNNER_TEMP/firefox"
          npx --yes web-ext@10.8.0 lint --source-dir "$RUNNER_TEMP/firefox"
