<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tirekick</title>
<link rel="icon" href="../icons/icon32.png">
<!-- colors (both themes), --ui/--display and the bundled typeface, from the same file as the panel and settings -->
<script src="../lib/theme.js" data-root data-fonts="../fonts/"></script>
<style>
  :root { --r:12px; --r-sm:7px; --bw:1px; }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.55 var(--ui); -webkit-font-smoothing:antialiased; }
  main { max-width:680px; margin:0 auto; padding:44px 24px 64px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .mark { width:36px; height:36px; flex:none; border-radius:22%; }
  h1 { margin:0; flex:1; font:800 34px/1.1 var(--display); letter-spacing:-.035em; }
  /* the wordmark's i's are dotted with brand-orange tread dots (as in the panel and settings) */
  .wm-i { position:relative; display:inline-block; }
  .wm-i::after { content:""; position:absolute; left:50%; top:.075em; width:.19em; height:.19em; margin-left:-.095em; border-radius:50%; background:#FF8F3A; }
  header a { color:var(--muted); font-size:13px; text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:3px; }
  header a:hover { color:var(--ink); text-decoration-color:currentColor; }
  h2 { margin:0 0 12px; font:800 23px/1.25 var(--display); letter-spacing:-.015em; }
  a { color:var(--ink); }
  button, .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:9px 14px; border-radius:var(--r-sm); border:var(--bw) solid var(--line); background:none; color:var(--ink); font:600 14px/1 var(--ui); text-decoration:none; cursor:pointer; }
  button:hover, .btn:hover { background:var(--paper-2); border-color:var(--ink); }
  button.primary { background:var(--btn); border-color:var(--btn); color:var(--on-btn); }
  button.primary:hover { opacity:.88; background:var(--btn); }
  button:disabled { opacity:.55; cursor:progress; }
  :is(button, .btn, a, input, summary):focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .hint { color:var(--muted); font-size:13px; }

  /* look something up */
  .look { padding:20px; border:var(--bw) solid var(--rule); border-radius:var(--r); background:var(--raise); }
  .look form { display:flex; gap:8px; flex-wrap:wrap; }
  .look input { flex:1 1 260px; min-height:44px; padding:10px 14px; border:var(--bw) solid var(--line); border-radius:var(--r-sm); background:var(--paper); color:var(--ink); font:inherit; font-size:16px; }
  .look input::placeholder { color:var(--muted); opacity:.75; }
  .sites { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .sites .btn { min-height:36px; font-size:13px; }
  .answer { margin-top:16px; }
  .answer:empty { display:none; }
  .status { color:var(--muted); font-size:13px; }
  .status.err { color:var(--danger); border-left:2px solid currentColor; padding-left:10px; }
  .mgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:14px; margin-top:4px; }
  .mcell { padding:2px 0 0 12px; border-left:2px solid var(--rule); }
  .mcell span { display:block; color:var(--muted); font-size:12px; }
  .mcell b { display:block; font:600 30px/1.15 var(--display); font-variant-numeric:lining-nums; letter-spacing:-.015em; margin:2px 0; }
  .comps { margin-top:12px; }
  .comps summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .comps ul { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:2px; }
  .comps li a { display:flex; gap:12px; padding:3px 0; color:var(--ink); text-decoration:none; font-size:13px; }
  .comps li a:hover .ct { text-decoration:underline; }
  .comps .cp { flex:none; width:56px; font:600 14px/1.5 var(--display); font-variant-numeric:lining-nums tabular-nums; }
  .comps .ct { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
  .caveat { margin-top:10px; }

  section.block { margin-top:34px; }
  .rows { display:grid; }
  .row { display:flex; gap:12px; align-items:baseline; padding:10px 0; border-top:var(--bw) solid var(--rule); }
  .row:first-child { border-top:0; }
  .row .t { flex:1; min-width:0; }
  .row .t a { font-weight:600; text-decoration:none; overflow-wrap:anywhere; }
  .row .t a:hover { text-decoration:underline; text-underline-offset:3px; }
  .row small { display:block; color:var(--muted); font-size:12px; }
  .row .pr { flex:none; font:600 17px/1.3 var(--display); font-variant-numeric:lining-nums tabular-nums; }
  .tag { flex:none; min-width:94px; text-align:center; font-size:12px; font-weight:600; padding:1px 9px; border-radius:999px; background:var(--paper-2); color:var(--muted); }
  .empty { color:var(--muted); font-size:14px; }
  .acts { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .homebox { margin-top:34px; }
  .homebox .hm-btn { min-height:24px; }
  .legal { margin-top:40px; padding-top:14px; border-top:var(--bw) solid var(--rule); color:var(--muted); font-size:12px; }
  .legal p { margin:0 0 6px; }
  [hidden] { display:none !important; }

  /* The same page as the toolbar icon's popup (hub.html?popup): narrow, tighter, the legal lines folded away */
  html.popup body { width:400px; }
  html.popup main { padding:14px 16px 16px; }
  html.popup header { margin-bottom:14px; gap:10px; }
  html.popup .mark { width:28px; height:28px; }
  html.popup h1 { font-size:24px; }
  html.popup h2 { font-size:18px; margin-bottom:8px; }
  html.popup .look { padding:14px; }
  html.popup .look input { flex-basis:180px; min-height:40px; font-size:15px; }
  html.popup .sites :is(.btn, button) { min-height:32px; padding:6px 10px; }
  html.popup section.block, html.popup .homebox { margin-top:22px; }
  html.popup .legal { margin-top:22px; }
  .tab-link { display:none; }
  html.popup .tab-link { display:inline; }
</style>
<script src="popup-mode.js"></script>
<style id="home-css"></style>
</head>
<body>
<main>
  <header>
    <img class="mark" src="../icons/icon48.png" width="36" height="36" alt="">
    <h1><span role="img" aria-label="Tirekick">t<span class="wm-i" aria-hidden="true">&#305;</span>rek<span class="wm-i" aria-hidden="true">&#305;</span>ck</span></h1>
    <a class="tab-link" href="hub.html" target="_blank" title="This page in its own tab">Open in a tab ↗</a>
    <a href="../options/options.html" id="settings-link">Settings</a>
  </header>

  <section class="look" aria-labelledby="look-h">
    <h2 id="look-h">Look something up</h2>
    <form id="look-form">
      <input id="q" type="search" placeholder="e.g. Pentax K1000, Game Boy Color" aria-label="What to look up" autocomplete="off">
      <button class="primary" id="go" type="submit">What it sells for</button>
    </form>
    <div class="sites" aria-label="Search for it"></div>
    <div class="answer" id="answer" aria-live="polite"></div>
  </section>

  <section class="block" aria-labelledby="saved-h" id="saved">
    <h2 id="saved-h">Saved</h2>
    <div id="saved-body"></div>
  </section>

  <div class="homebox" id="home"></div>

  <footer class="legal">
    <p>Scores, prices, margins and warnings are estimates to help you decide, not advice or a guarantee: a model can be wrong and sold prices are approximate, so check the listing and the seller yourself.</p>
    <p id="not-affiliated"></p>
  </footer>
</main>
<script src="../lib/sites.js"></script>
<script src="../lib/shared.js"></script>
<script src="../content/adapters.js"></script>
<script src="../lib/sold.js"></script>
<script src="../content/home.js"></script>
<script src="hub.js"></script>
</body>
</html>
